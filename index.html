<!doctype html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta 
    name="viewport" 
    content="width=device-width, initial-scale=1.0">


    <title>
        Sam's Bookstore | JavaScript E-commerce
    </title>



    <!-- Bootstrap -->

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet">



    <!-- Custom CSS -->


    <link rel="stylesheet" href="./css/style.css">


</head>




<body>



<header class="bg-success text-white py-3">


<div class="container">


<div class="d-flex justify-content-between align-items-center">


<h1 class="h4 mb-0">

📚 Sam's Bookstore

</h1>




<div class="cart-icon position-relative">


🛒


<span

id="cart-count"

class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">

0

</span>


</div>



</div>


</div>


</header>








<main class="container my-4">



<div class="row g-4">





<!-- Products -->

<section class="col-12 col-md-8">


<h2 class="h5 mb-3">

Books

</h2>



<div

id="product-list"

class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">


</div>



</section>









<!-- Cart -->


<aside class="col-12 col-md-4">



<div class="card shadow-sm">


<div class="card-body">



<h2 class="h6">

🛍️ Shopping Cart

</h2>




<ul

id="cart-items"

class="list-group mb-3">


</ul>






<p>


<strong>

Total:

<span id="total">

0

</span>

$

</strong>


</p>






<button

id="checkout-btn"

class="btn btn-primary w-100">


💳 Checkout


</button>





</div>


</div>



</aside>





</div>



</main>












<!-- Checkout Modal -->


<div

class="modal fade"

id="checkoutModal"

tabindex="-1">



<div class="modal-dialog modal-dialog-centered">



<div class="modal-content">





<div class="modal-header">


<h5 class="modal-title">

Checkout

</h5>



<button

type="button"

class="btn-close"

data-bs-dismiss="modal">

</button>



</div>







<div class="modal-body">



<form id="checkout-form" novalidate>







<!-- STEP 1 -->


<div id="step-info">



<h6 class="mb-3">

Customer Information

</h6>





<div class="mb-3">


<label class="form-label">

Name

</label>


<input

id="customer-name"

class="form-control"

type="text"

placeholder="Enter your name">


</div>







<div class="mb-3">


<label class="form-label">

Phone Number

</label>


<input

id="customer-phone"

class="form-control"

type="tel"

placeholder="Enter phone number">


</div>







<div class="mb-3">


<label class="form-label">

Address

</label>


<textarea

id="customer-address"

class="form-control"

rows="3"

placeholder="Enter your address"></textarea>


</div>








<button

type="button"

id="review-btn"

class="btn btn-primary w-100">


Review Order


</button>





</div>









<!-- STEP 2 -->


<div

id="step-review"

style="display:none;">





<h6 class="mb-3">

Order Summary

</h6>






<ul

id="review-items"

class="list-group mb-3">


</ul>






<p>


<strong>

Total:

<span id="review-total">

0

</span>

$

</strong>


</p>








<div class="d-flex gap-2">



<button

type="button"

id="back-btn"

class="btn btn-secondary w-50">


Back


</button>






<button

type="submit"

class="btn btn-success w-50">


Confirm Order


</button>



</div>





</div>






</form>






</div>





</div>


</div>


</div>









<!-- Bootstrap JS -->


<script

src="https://code.jquery.com/jquery-3.7.1.min.js">

</script>




<script

src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">

</script>







<!-- App JS -->


<script

type="module"

src="./Js/app.js">

</script>




</body>


</html>
